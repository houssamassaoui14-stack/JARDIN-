const $=id=>document.getElementById(id);let running=false,t=0,last=0,mode='all';const stages=[['Le panneau reçoit la lumière solaire.','01 / 04'],['L’électricité alimente la commande et la pompe.','02 / 04'],['La pompe aspire l’eau et la refoule vers l’arroseur.','03 / 04'],['L’arroseur distribue l’eau : le système fonctionne.','04 / 04']];function draw(){let n=t<3?0:t<6?1:t<9?2:3;let v={solar:running&&mode!=='water',electric:running&&n>=1&&mode!=='water',intake:running&&n>=2&&mode!=='power',outflow:running&&n>=2&&mode!=='power',sprays:running&&n>=3&&mode!=='power'};for(let [k,b] of Object.entries(v)){$(k).setAttribute('opacity',b?1:0);$(k).setAttribute('stroke-dashoffset',-t*42)}$('stage').textContent=running?stages[n][0]:'Système à l’arrêt — prêt à démarrer.';$('step').textContent=running?stages[n][1]:'À L’ARRÊT';$('progress').setAttribute('width',running?Math.min(t/15,1)*220:0);$('led').setAttribute('fill',running&&n>=1?'#34c77e':'#82929c');}function tick(now){if(running&&last)t=Math.min(t+(now-last)/1000,100000);last=now;draw();if(running)requestAnimationFrame(tick)}$('start').onclick=()=>{if(!running){last=0;requestAnimationFrame(tick)}running=true;t=0};$('stop').onclick=()=>{running=false;t=0;draw()};$('reset').onclick=()=>{if(!running){last=0;requestAnimationFrame(tick)}running=true;t=0;draw()};for(let k of ['all','water','power'])$(k).onclick=()=>{mode=k;for(let a of ['all','water','power'])$(a).setAttribute('aria-pressed',a===k);draw()};const parts={panel:'Panneau photovoltaïque — transforme le rayonnement solaire en électricité.',controller:'Boîtier de commande — commande et protège le circuit électrique.',reservoir:'Réservoir — stocke l’eau et alimente l’aspiration de la pompe.',pump:'Pompe DC — aspire l’eau et la refoule vers l’arroseur.',sprinkler:'Arroseur sphérique — répartit l’eau sur la zone à arroser.'};for(let [id,desc] of Object.entries(parts)){let g=$(id);g.setAttribute('tabindex','0');g.setAttribute('role','button');g.setAttribute('aria-label',desc);let show=()=>{$('info').textContent=desc};g.addEventListener('click',show);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show()}})}draw();</script></body></html>
